name: Floral kernel

on:
  push:
    branches: ['feature/stage1-nova-full', 'feature/stage2-native-containers', 'feature/stage3-selected-optimizations']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      stage:
        description: Build stage
        type: choice
        options: [baseline, stage1]
        default: stage1
      source_ref:
        description: Optional source commit or ref
        type: string
        required: false
        default: feature/stage1-nova-full
      runner_label:
        description: Runner label (default GitHub-hosted; optional dedicated high-memory runner)
        type: string
        required: false
        default: ubuntu-24.04
      make_jobs:
        description: Parallel make jobs (use 8 for the dedicated 8-CPU runner)
        type: choice
        options: ['1', '2', '4', '8']
        default: '4'

permissions:
  contents: read
  actions: read

concurrency:
  group: floral-${{ github.ref }}-${{ github.event_name }}-${{ inputs.stage || 'stage1' }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      FLORAL_JOBS: ${{ inputs.make_jobs || '4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'workflow_dispatch' && 'feature/stage1-nova-full') || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select build and fetch baseline
        id: select
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
        run: |
          stage=${REQUESTED_STAGE:-stage1}
          if [[ ! -f drivers/kernelsu/ksu.c ]]; then stage=baseline; fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch --depth 1 origin bb17b7de4b570f2c0c32ddba0543cac03c58dd84
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zip cpio
          memory_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          if (( memory_kib < 50331648 )); then
            sudo fallocate -l 48G /swapfile-floral
            sudo chmod 600 /swapfile-floral
            sudo mkswap /swapfile-floral
            sudo swapon /swapfile-floral
          fi
          free -h
      - name: Prepare frozen dependencies
        run: bash ci/scripts/prepare.sh
      - name: Compile and check
        run: |
          if [[ -f ci/scripts/run-with-resource-monitor.sh ]]; then
            bash ci/scripts/run-with-resource-monitor.sh '${{ steps.select.outputs.stage }}' bash ci/scripts/build.sh '${{ steps.select.outputs.stage }}'
          else
            bash ci/scripts/build.sh '${{ steps.select.outputs.stage }}'
          fi
      - name: Package flashable images
        if: steps.select.outputs.stage == 'stage1'
        run: |
          bash ci/scripts/kpm.sh
          bash ci/scripts/package.sh stage1
      - name: Upload build evidence and successful artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floral-${{ steps.select.outputs.stage }}-${{ steps.select.outputs.source_sha }}
          path: .ci-dist/
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
