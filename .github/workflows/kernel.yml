name: Floral kernel

on:
  push:
    branches: ['feature/stage1-nova-full', 'feature/stage2-native-containers', 'feature/stage3-selected-optimizations']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      stage:
        description: Build stage
        type: choice
        options: [auto, baseline, stage1, stage2]
        default: auto
      source_ref:
        description: Optional source commit or ref (empty uses the selected workflow ref)
        type: string
        required: false
        default: ''
      runner_label:
        description: Runner label (default GitHub-hosted; optional dedicated high-memory runner)
        type: string
        required: false
        default: ubuntu-24.04
      make_jobs:
        description: Parallel make jobs (auto uses nproc; a positive integer overrides it)
        type: string
        required: false
        default: auto
      boot_image_url:
        description: Optional HTTPS URL of the current ROM boot.img for a Fastboot package
        type: string
        required: false
      boot_device:
        description: Device for the optional boot.img (ignored when URL is empty)
        type: choice
        options: [flame, coral]
        default: flame

permissions:
  contents: read
  actions: read

concurrency:
  group: floral-${{ github.ref }}-${{ github.event_name }}-${{ inputs.stage || 'auto' }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      FLORAL_JOBS: ${{ inputs.make_jobs || 'auto' }}
      FLORAL_BOOT_IMAGE_URL: ${{ inputs.boot_image_url }}
      FLORAL_BOOT_DEVICE: ${{ inputs.boot_device || 'flame' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select build and fetch baseline
        id: select
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
        run: |
          floral_cpus=$(nproc)
          if [[ "$FLORAL_JOBS" == auto ]]; then FLORAL_JOBS=$floral_cpus; fi
          if [[ ! "$FLORAL_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'make_jobs must be auto or a positive integer' >&2
            exit 2
          fi
          echo "FLORAL_JOBS=$FLORAL_JOBS" >> "$GITHUB_ENV"
          echo "Selected make jobs: $FLORAL_JOBS; available CPUs: $floral_cpus"
          stage=${REQUESTED_STAGE:-auto}
          if [[ "$stage" == auto ]]; then
            if [[ -f ci/configs/stage2.config ]]; then
              stage=stage2
            elif [[ -f drivers/kernelsu/ksu.c ]]; then
              stage=stage1
            else
              stage=baseline
            fi
          fi
          case "$stage" in baseline|stage1|stage2) ;; *) exit 2 ;; esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch --depth 1 origin bb17b7de4b570f2c0c32ddba0543cac03c58dd84
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zip cpio
          if [[ -n "$FLORAL_BOOT_IMAGE_URL" ]]; then
            sudo apt-get install -y qemu-user
          fi
          memory_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          if (( memory_kib < 50331648 )); then
            sudo fallocate -l 48G /swapfile-floral
            sudo chmod 600 /swapfile-floral
            sudo mkswap /swapfile-floral
            sudo swapon /swapfile-floral
          fi
          free -h
      - name: Prepare frozen dependencies
        run: bash ci/scripts/prepare.sh
      - name: Compile and check
        run: |
          if [[ -f ci/scripts/run-with-resource-monitor.sh ]]; then
            bash ci/scripts/run-with-resource-monitor.sh '${{ steps.select.outputs.stage }}' bash ci/scripts/build.sh '${{ steps.select.outputs.stage }}'
          else
            bash ci/scripts/build.sh '${{ steps.select.outputs.stage }}'
          fi
      - name: Package AnyKernel3 and optional Fastboot image
        if: steps.select.outputs.stage == 'stage1' || steps.select.outputs.stage == 'stage2'
        run: |
          bash ci/scripts/kpm.sh '${{ steps.select.outputs.stage }}'
          bash ci/scripts/package.sh '${{ steps.select.outputs.stage }}'
      - name: Upload build evidence and successful artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floral-${{ steps.select.outputs.stage }}-${{ steps.select.outputs.source_sha }}
          path: .ci-dist/
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
